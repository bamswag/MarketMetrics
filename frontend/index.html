<!doctype html>
<html lang="en" data-background-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const stored = JSON.parse(localStorage.getItem('marketmetrics.marketPreferences') || '{}')
          document.documentElement.dataset.backgroundTheme =
            stored.backgroundTheme === 'light' || stored.backgroundTheme === 'diamond-light'
              ? 'light'
              : 'dark'
        } catch {
          document.documentElement.dataset.backgroundTheme = 'dark'
        }
      })()
    </script>
    <title>Market Metrics</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
